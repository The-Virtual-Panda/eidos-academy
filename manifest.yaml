# The plugin's manifest, read by the host before any of its code runs.
name: academy
title: Academy
description: "Build quizzes and flashcard decks on your project's content, group them into ordered courses, and follow how people are doing over time"
version: 0.4.1
min_host: 0.18.0
# a quiz's public link, drawn by dist/guest.js once Eidos has reviewed this version (Plugin Share Links REQ1)
share_links: true
folder:
  kind: academy
  name: academy
  description: "The quizzes and flashcard decks on this project's content, one markdown file each, and the courses that group them, kept by the Academy plugin"
files:
  - path: '{workspace}/local/**'
    merge: local
  - path: '{workspace}/results/**'
    merge: text
  - path: '{folder}/**'
    merge: text
settings: []
agents: "Quizzes and flashcard decks on the project's content live in the Academy plugin's folder, grouped into courses or kept as one-offs, with people's results and study sessions in its workspace. Run `eidos instructions academy` before writing a quiz, a deck, or a study plan; `eidos academy` lists and edits them, and lessons, wiki pages, and study plans stay blueprints in the project's collections."
