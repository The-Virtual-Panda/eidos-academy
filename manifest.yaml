# The plugin's manifest, read by the host before any of its code runs.
name: quizzes
title: Quizzes
description: "Build multiple-choice quizzes on your project's content, group them into ordered courses, practice locally, take them officially, and keep every score over time"
version: 0.1.0
min_host: 0.19.0
folder:
  kind: quizzes
  name: quizzes
  description: "The quizzes on this project's content, one markdown file each, and the courses that group them, kept by the Quizzes plugin"
files:
  - path: '{workspace}/local/**'
    merge: local
  - path: '{workspace}/results/**'
    merge: text
  - path: '{folder}/**'
    merge: text
settings: []
agents: "Quizzes on the project's content live in the Quizzes plugin's folder, grouped into courses or kept as one-offs, with official results in its workspace. Run `eidos instructions quizzes` before writing a quiz or a study plan; `eidos quizzes` lists and edits them, and lessons, wiki pages, and study plans stay blueprints in the project's collections."
